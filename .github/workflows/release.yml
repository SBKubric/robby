name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Version from tag
        id: version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::Tag must look like vX.Y.Z (Y and Z below 100), got $GITHUB_REF_NAME"
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          echo "name=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        env:
          ROBBY_KEYSTORE_BASE64: ${{ secrets.ROBBY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ROBBY_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ROBBY_KEYSTORE_BASE64 is not set (see docs/release.md)"
            exit 1
          fi
          echo "$ROBBY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test :core and build signed release APK
        env:
          ROBBY_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ROBBY_KEYSTORE_PASSWORD: ${{ secrets.ROBBY_KEYSTORE_PASSWORD }}
          ROBBY_KEY_ALIAS: ${{ secrets.ROBBY_KEY_ALIAS }}
          ROBBY_KEY_PASSWORD: ${{ secrets.ROBBY_KEY_PASSWORD }}
        run: >
          ./gradlew :core:test :app:assembleRelease
          -Probby.versionName=${{ steps.version.outputs.name }}
          -Probby.versionCode=${{ steps.version.outputs.code }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Without all four signing secrets Gradle writes app-release-unsigned.apk instead.
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::Signed APK not found; check the four ROBBY_* secrets"
            exit 1
          fi
          asset="robby-$GITHUB_REF_NAME.apk"
          cp "$apk" "$asset"
          gh release create "$GITHUB_REF_NAME" "$asset" \
            --title "Robby $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
