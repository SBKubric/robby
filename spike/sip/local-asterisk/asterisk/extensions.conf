; Only the two accounts, and only each other. Anything else is refused.
[general]
static=yes
writeprotect=yes

[internal]
exten => office,1,NoOp(robby -> office)
 same => n,Dial(PJSIP/office,30)
 same => n,Hangup()

exten => robby,1,NoOp(office -> robby)
 same => n,Dial(PJSIP/robby,30)
 same => n,Hangup()

exten => i,1,Hangup(21)
